AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Saans API with SAM

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod

Globals:
  Function:
    Runtime: python3.12
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        STAGE: !Ref Stage
        LOG_LEVEL: INFO
        ALLOWED_ORIGIN: "*"

Resources:
  # ─── Cognito ─────────────────────────────────────────────
  SaansUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub saans-users-${Stage}
      UsernameAttributes:
        - email
        - phone_number
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: role
          AttributeDataType: String
          Mutable: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
      LambdaConfig:
        PreSignUp: !GetAtt PreSignupFunction.Arn

  SaansUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub saans-web-${Stage}
      UserPoolId: !Ref SaansUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      ReadAttributes:
        - custom:role
        - name
        - email
        - phone_number
      WriteAttributes:
        - custom:role
        - name
        - email
        - phone_number

  PreSignupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub saans-presignup-${Stage}
      CodeUri: ../services/
      Handler: api.auth.pre_signup.handler

  PreSignupCognitoInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt PreSignupFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt SaansUserPool.Arn

  # ─── API Gateway ─────────────────────────────────────────
  SaansApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt SaansUserPool.Arn
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub saans-health-${Stage}
      CodeUri: ../services/
      Handler: api.handlers.health.handler
      Events:
        GetHealth:
          Type: Api
          Properties:
            RestApiId: !Ref SaansApi
            Path: /v1/health
            Method: GET
            Auth:
              Authorizer: NONE

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${SaansApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref SaansUserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref SaansUserPoolClient
  Region:
    Description: AWS Region
    Value: !Ref AWS::Region
