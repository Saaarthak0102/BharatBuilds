AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Saans API with SAM

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - x86_64
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        STAGE: !Ref Stage
        LOG_LEVEL: INFO
        ALLOWED_ORIGIN: "*"
        USERS_TABLE: !Ref UsersTable
        REPORTS_TABLE: !Ref ReportsTable
        MACHINE_SLOTS_TABLE: !Ref MachineSlotsTable
        STRAW_OUTLETS_TABLE: !Ref StrawOutletsTable
        BOOKINGS_TABLE: !Ref BookingsTable
        SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTable
        DATA_CACHE_TABLE: !Ref DataCacheTable
        AGENT_RUNS_TABLE: !Ref AgentRunsTable
        FIRMS_API_KEY_PARAM: !Sub /saans/${Stage}/firms-api-key
        OPENAQ_API_KEY_PARAM: !Sub /saans/${Stage}/openaq-api-key

Resources:
  # ─── DynamoDB Tables ─────────────────────────────────────
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub saans-users-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  ReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub saans-reports-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: report_id
          AttributeType: S
        - AttributeName: geohash
          AttributeType: S
      KeySchema:
        - AttributeName: report_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: geohash-index
          KeySchema:
            - AttributeName: geohash
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  MachineSlotsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub saans-machine-slots-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: village_id
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: village_id
          KeyType: HASH
        - AttributeName: date
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  StrawOutletsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub saans-straw-outlets-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: district_id
          AttributeType: S
        - AttributeName: outlet_id
          AttributeType: S
      KeySchema:
        - AttributeName: district_id
          KeyType: HASH
        - AttributeName: outlet_id
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  BookingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub saans-bookings-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: booking_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: booking_id
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  SubscriptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub saans-subscriptions-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: subscription_id
          AttributeType: S
        - AttributeName: area_id
          AttributeType: S
      KeySchema:
        - AttributeName: subscription_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: area_id-index
          KeySchema:
            - AttributeName: area_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  DataCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub saans-data-cache-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: source
          AttributeType: S
        - AttributeName: key
          AttributeType: S
      KeySchema:
        - AttributeName: source
          KeyType: HASH
        - AttributeName: key
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  AgentRunsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub saans-agent-runs-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: run_id
          AttributeType: S
      KeySchema:
        - AttributeName: run_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  # ─── Cognito ─────────────────────────────────────────────
  SaansUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub saans-users-${Stage}
      UsernameAttributes:
        - email
        - phone_number
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: role
          AttributeDataType: String
          Mutable: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
      LambdaConfig:
        PreSignUp: !GetAtt PreSignupFunction.Arn

  SaansUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub saans-web-${Stage}
      UserPoolId: !Ref SaansUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      ReadAttributes:
        - custom:role
        - name
        - email
        - phone_number
      WriteAttributes:
        - custom:role
        - name
        - email
        - phone_number

  PreSignupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub saans-presignup-${Stage}
      CodeUri: ../services/
      Handler: api.auth.pre_signup.handler

  PreSignupCognitoInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt PreSignupFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt SaansUserPool.Arn

  # ─── API Gateway ─────────────────────────────────────────
  SaansApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt SaansUserPool.Arn
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub saans-health-${Stage}
      CodeUri: ../services/
      Handler: api.handlers.health.handler
      Events:
        GetHealth:
          Type: Api
          Properties:
            RestApiId: !Ref SaansApi
            Path: /v1/health
            Method: GET
            Auth:
              Authorizer: NONE

  FarmerPlanFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub saans-farmer-plan-${Stage}
      CodeUri: ../services/
      Handler: api.handlers.farmer_plan.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DataCacheTable
        - DynamoDBReadPolicy:
            TableName: !Ref MachineSlotsTable
        - DynamoDBReadPolicy:
            TableName: !Ref StrawOutletsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AgentRunsTable
      Events:
        PostFarmerPlan:
          Type: Api
          Properties:
            RestApiId: !Ref SaansApi
            Path: /v1/farmer/plan
            Method: POST

  FarmerBookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub saans-farmer-book-${Stage}
      CodeUri: ../services/
      Handler: api.handlers.farmer_book.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MachineSlotsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BookingsTable
      Events:
        PostFarmerBook:
          Type: Api
          Properties:
            RestApiId: !Ref SaansApi
            Path: /v1/farmer/book
            Method: POST

  StrawOutletsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub saans-straw-outlets-${Stage}
      CodeUri: ../services/
      Handler: api.handlers.straw_outlets.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref StrawOutletsTable
      Events:
        GetStrawOutlets:
          Type: Api
          Properties:
            RestApiId: !Ref SaansApi
            Path: /v1/farmer/straw-outlets
            Method: GET

  TodayFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub saans-today-${Stage}
      CodeUri: ../services/
      Handler: api.handlers.today.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DataCacheTable
        - DynamoDBReadPolicy:
            TableName: !Ref ReportsTable
      Events:
        GetToday:
          Type: Api
          Properties:
            RestApiId: !Ref SaansApi
            Path: /v1/today
            Method: GET

  AskFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub saans-ask-${Stage}
      CodeUri: ../services/
      Handler: api.handlers.ask.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DataCacheTable
      Events:
        PostAsk:
          Type: Api
          Properties:
            RestApiId: !Ref SaansApi
            Path: /v1/ask
            Method: POST

  MapLayersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub saans-map-layers-${Stage}
      CodeUri: ../services/
      Handler: api.handlers.map_layers.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DataCacheTable
        - DynamoDBReadPolicy:
            TableName: !Ref ReportsTable
      Events:
        GetMapLayers:
          Type: Api
          Properties:
            RestApiId: !Ref SaansApi
            Path: /v1/map/layers
            Method: GET

  ReportsUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub saans-reports-upload-url-${Stage}
      CodeUri: ../services/
      Handler: api.handlers.reports_upload_url.handler
      Events:
        PostUploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref SaansApi
            Path: /v1/reports/upload-url
            Method: POST

  ReportsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub saans-reports-${Stage}
      CodeUri: ../services/
      Handler: api.handlers.reports.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReportsTable
      Events:
        GetReports:
          Type: Api
          Properties:
            RestApiId: !Ref SaansApi
            Path: /v1/reports
            Method: GET
        PostReports:
          Type: Api
          Properties:
            RestApiId: !Ref SaansApi
            Path: /v1/reports
            Method: POST

  SubscriptionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub saans-subscriptions-${Stage}
      CodeUri: ../services/
      Handler: api.handlers.subscriptions.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubscriptionsTable
      Events:
        PostSubscriptions:
          Type: Api
          Properties:
            RestApiId: !Ref SaansApi
            Path: /v1/subscriptions
            Method: POST

  ProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub saans-profile-${Stage}
      CodeUri: ../services/
      Handler: api.handlers.profile.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        GetProfile:
          Type: Api
          Properties:
            RestApiId: !Ref SaansApi
            Path: /v1/profile
            Method: GET
        PostAuthProfile:
          Type: Api
          Properties:
            RestApiId: !Ref SaansApi
            Path: /v1/auth/profile
            Method: POST

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub saans-ingest-${Stage}
      CodeUri: ../services/
      Handler: ingest.handler.handler
      Timeout: 60
      Policies:
        - Statement:
            - Sid: DataCacheAccessOnly
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:BatchWriteItem
                - dynamodb:BatchGetItem
              Resource: !GetAtt DataCacheTable.Arn
            - Sid: SSMParameterAccess
              Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/saans/${Stage}/firms-api-key
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/saans/${Stage}/openaq-api-key
      Events:
        IngestSchedule:
          Type: Schedule
          Properties:
            Schedule: rate(3 hours)
            Description: Ingest weather and environmental data every 3 hours
            Enabled: true

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${SaansApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref SaansUserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref SaansUserPoolClient
  Region:
    Description: AWS Region
    Value: !Ref AWS::Region
  UsersTable:
    Description: DynamoDB Users table name
    Value: !Ref UsersTable
  ReportsTable:
    Description: DynamoDB Reports table name
    Value: !Ref ReportsTable
  MachineSlotsTable:
    Description: DynamoDB MachineSlots table name
    Value: !Ref MachineSlotsTable
  StrawOutletsTable:
    Description: DynamoDB StrawOutlets table name
    Value: !Ref StrawOutletsTable
  BookingsTable:
    Description: DynamoDB Bookings table name
    Value: !Ref BookingsTable
  SubscriptionsTable:
    Description: DynamoDB Subscriptions table name
    Value: !Ref SubscriptionsTable
  DataCacheTable:
    Description: DynamoDB DataCache table name
    Value: !Ref DataCacheTable
  AgentRunsTable:
    Description: DynamoDB AgentRuns table name
    Value: !Ref AgentRunsTable
  IngestFunction:
    Description: Lambda function ARN for data ingestion
    Value: !GetAtt IngestFunction.Arn
